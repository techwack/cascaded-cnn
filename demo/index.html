<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascaded-SolarNet Demo</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #14181f; --muted: #5d6675; --line: #d9dde4;
    --bar: #c9d3e3; --pick: #1f4fd8; --pick-ink: #ffffff; --ok: #17803d; --bad: #c0261c; --skip: #eceef2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --panel: #181c24; --ink: #e8ebf1; --muted: #98a1b0; --line: #2b313c;
      --bar: #2f3a50; --pick: #6f95ff; --pick-ink: #0b1020; --ok: #4cc27a; --bad: #ff7b70; --skip: #141821;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .imgbox { display: flex; justify-content: center; background: #000; border-radius: 6px; padding: 8px; }
  .imgbox img { image-rendering: pixelated; width: 144px; height: 240px; max-width: 100%; }
  .caption { color: var(--muted); font-size: 12.5px; margin: 8px 0 14px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 4px; }
  select, button { font: inherit; width: 100%; padding: 9px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button { cursor: pointer; margin-top: 8px; font-weight: 600; }
  button.primary { background: var(--pick); border-color: var(--pick); color: var(--pick-ink); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
  input[type=file] { width: 100%; font-size: 13px; color: var(--muted); }
  .stage { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .stage.skipped { background: var(--skip); color: var(--muted); }
  .stage h2 { font-size: 14px; margin: 0 0 8px; }
  .row { display: grid; grid-template-columns: 130px 1fr 52px; align-items: center; gap: 10px; font-size: 13.5px; padding: 2px 0; }
  .track { height: 10px; background: var(--skip); border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; background: var(--bar); border-radius: 5px; }
  .row.pick .fill { background: var(--pick); }
  .row.pick .name, .row.pick .pct { font-weight: 700; }
  .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .result { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  .final { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .badge { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; }
  .badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cascaded-SolarNet</h1>
  <p class="sub">Infrared solar-panel defect classification: five small CNNs, three stages, one decision path per image.</p>
  <div class="stats" id="stats" aria-live="polite"></div>

  <div class="grid">
    <div class="panel">
      <div class="imgbox"><img id="img" alt="Infrared image of a solar module" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></div>
      <p class="caption" id="caption">Loading a sample ...</p>

      <label for="cls">Test-set class</label>
      <select id="cls"><option value="">Any class</option></select>
      <button class="primary" id="random">Random test image</button>
      <button id="mistake">Show a mistake</button>

      <label for="file">Or try your own image</label>
      <input type="file" id="file" accept="image/*">
      <div class="err" id="err" role="alert"></div>
    </div>

    <div>
      <div class="panel" style="margin-bottom:10px">
        <div class="result">
          <span class="final" id="final">-</span>
          <span class="badge" id="badge" hidden></span>
        </div>
        <div class="meta" id="meta"></div>
      </div>
      <div id="stages"></div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const pct = (p) => (p * 100).toFixed(1) + "%";

async function api(url, opts) {
  const r = await fetch(url, opts);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "request failed");
  return d;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function stageCard(s) {
  const card = el("div", "stage");
  card.appendChild(el("h2", "", s.title));
  s.classes.forEach((c, i) => {
    const row = el("div", "row" + (i === s.pick ? " pick" : ""));
    row.appendChild(el("span", "name", c));
    const track = el("div", "track");
    const fill = el("div", "fill");
    fill.style.width = (s.probs[i] * 100).toFixed(1) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("span", "pct", pct(s.probs[i])));
    card.appendChild(row);
  });
  return card;
}

function skippedCard(title) {
  const card = el("div", "stage skipped");
  card.appendChild(el("h2", "", title));
  card.appendChild(el("div", "", "Skipped: the panel exited early at Stage 1."));
  return card;
}

function render(d) {
  $("#img").src = d.image;
  $("#caption").textContent = d.truth === null
    ? "Your image, resized to 24 x 40. Colours are for display only."
    : `Test image #${d.id}. True class: ${d.truth}. Colours are for display only.`;
  $("#final").textContent = d.prediction;
  const badge = $("#badge");
  badge.hidden = d.correct === null;
  if (d.correct !== null) {
    badge.textContent = d.correct ? "Correct" : "Wrong";
    badge.className = "badge " + (d.correct ? "ok" : "bad");
  }
  const nets = d.stages.length;
  $("#meta").textContent = `${nets} of 5 networks ran, ${d.latency_ms.toFixed(1)} ms on CPU` +
    (d.correct === false ? `. True class: ${d.truth}.` : ".");
  const box = $("#stages");
  box.replaceChildren(...d.stages.map(stageCard));
  if (nets === 1) {
    box.appendChild(skippedCard("Stage 2 · Fault family"));
    box.appendChild(skippedCard("Stage 3 · Specialist"));
  }
}

async function run(url, opts) {
  $("#err").textContent = "";
  try { render(await api(url, opts)); }
  catch (e) { $("#err").textContent = e.message; }
}

const sample = () => run("/api/sample?cls=" + encodeURIComponent($("#cls").value));

$("#random").addEventListener("click", sample);
$("#cls").addEventListener("change", sample);
$("#mistake").addEventListener("click", () => run("/api/sample?mode=mistake"));
$("#file").addEventListener("change", (ev) => {
  const f = ev.target.files[0];
  if (f) run("/api/upload", { method: "POST", body: f });
});

(async () => {
  const m = await api("/api/meta");
  m.classes.forEach((c) => $("#cls").appendChild(el("option", "", c)).value = c);
  const stats = $("#stats");
  [["Test accuracy", pct(m.accuracy)], ["Test images", m.n_test.toLocaleString()],
   ["Exit at Stage 1", pct(m.early_exit)]].forEach(([k, v]) => {
    const s = el("span", "", k + " ");
    s.appendChild(el("b", "", v));
    stats.appendChild(s);
  });
  sample();
})();
</script>
</body>
</html>
