[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarnet"
version = "0.1.0"
description = "Cascaded CNN for 12-class solar panel defect classification on IR images"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "scikit-learn>=1.3", "pillow>=10.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
